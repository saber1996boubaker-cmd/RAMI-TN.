name: Build RAMI TN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q RAMI-TN-Android-Project.zip -d project
          find project -name gradlew -exec dirname {} \; > gradle_path.txt
          GRADLE_DIR=$(head -n 1 gradle_path.txt)
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMI-TN-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
